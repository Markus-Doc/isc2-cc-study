": "additional"}, {"id": 58, "d": 0, "q": "An employee notices a poster in the lunchroom reminding her about not writing down her passwords but instead to use the companyprovided password vault software. What is this an example of?", "o": ["Security awareness", "Security training", "Security policy", "Security testing"], "a": 0, "r": "The use of posters and reminders in the workplace is an example of security awareness.", "src": "additional"}, {"id": 59, "d": 0, "q": "What is the best reason to provide social engineering training to employees?", "o": ["To show people how to perform a social engineering attack", "So employees can report security violations to management", "To teach people what to look out for", "None of the above"], "a": 2, "r": "The correct answer is to show people what kinds of things they should look out for as a way to defend against social engineering attacks.", "src": "additional"}, {"id": 60, "d": 0, "q": "During which phase of the incident response process is the incident response plan developed and documented?", "o": ["Preparation", "Containment, eradication, and recovery", "Detection and analysis", "Post-incident activity"], "a": 0, "r": "The incident response plan is developed and documented during the preparation phase of the incident response process.", "src": "additional"}, {"id": 61, "d": 0, "q": "During which phase of the incident response process does the lessonslearned assessment take place?", "o": ["Detection and analysis", "Containment, eradication, and recovery", "Preparation", "Post-incident activity"], "a": 3, "r": "The lessons-learned assessment occurs during the post-incident activity phase of the incident response process.", "src": "additional"}, {"id": 62, "d": 0, "q": "A security analyst is reviewing log files from a system to determine if a security incident has occurred. This is an example of an activity that takes place in which of the following incident response process phases?", "o": ["Containment, eradication, and recovery", "Detection and analysis", "Preparation", "Post-incident activity"], "a": 1, "r": "Reviewing logs to determine if a security incident has occurred is an example of an activity that takes place in the detection and analysis phase of the incident response process.", "src": "additional"}, {"id": 63, "d": 0, "q": "In which phase of the incident response process would a security analyst recover a system from a backup?", "o": ["Preparation", "Detection and analysis", "Post-incident activity", "Containment, eradication, and recovery"], "a": 3, "r": "Recovering a system from backup would take place during the containment, eradication, and recovery phase of the incident response process.", "src": "additional"}, {"id": 64, "d": 0, "q": "What phase comes after the detection and analysis phase in the incident response process?", "o": ["Containment, eradication, and recovery.", "Preparation.", "Post-incident activity.", "Detection and analysis is the last phase of the process."], "a": 0, "r": "The containment, eradication, and recovery phase comes after the detection and analysis phase of the incident response process. The process steps are Preparation -> Detection and Analysis -> Containment, Eradication, and Recovery -> Post-Incident Activity.", "src": "additional"}, {"id": 65, "d": 0, "q": "Carol is tasked with creating a business continuity plan for her organization. What should she do to determine which of her organization’s business functions should be restored in the event of an incident?", "o": ["Conduct a risk assessment.", "Interview key stakeholders throughout the organization.", "Calculate the MTD for each business function.", "Conduct a business impact analysis."], "a": 3, "r": "The purpose of a business impact analysis is to determine which business functions should be restored after an incident.", "src": "additional"}, {"id": 67, "d": 0, "q": "Of the following which is the most likely reason(s) a business continuity program might fail?", "o": ["Failure to test the plan and procedures", "Failure to document activation procedures", "Failure to address the threats the organization is most likely to"], "a": 3, "r": "Failure to test the plan and procedures, document activation procedures, and address likely threats are all reasons the business continuity program may fail.", "src": "additional"}, {"id": 68, "d": 0, "q": "Alice is responsible for designing her organization’s datacenter to provide resiliency in the event of a disaster. If a disaster occurs, she wants to have the new datacenter up and running within a few days, but she does not want to incur the cost of building a full datacenter with all equipment fully installed and configured. Which of the following options is the best choice for her situation?", "o": ["Hot site", "Warm site", "Cold site", "Tertiary site"], "a": 1, "r": "A warm site is a facility that is configured with equipment suitable for supporting IT operations but without the computing equipment itself. The warm site has power, HVAC, physical infrastructure, and possibly telecommunications and peripheral equipment.", "src": "additional"}, {"id": 69, "d": 0, "q": "Which of the following is the best example of a hot site?", "o": ["A facility that is configured with equipment suitable for supporting IT operations but without the computing equipment itself", "A facility that is configured with equipment suitable for supporting IT operations and has the computing equipment installed and"], "a": 1, "r": "A hot site is a facility that is configured with equipment suitable for supporting IT operations and has the computing equipment", "src": "additional"}, {"id": 70, "d": 0, "q": "Which of the following is the best example of a cold site?", "o": ["A facility that is configured with equipment suitable for supporting IT operations but without the computing equipment itself", "A facility that is configured with equipment suitable for supporting IT operations and has the computing equipment installed and configured", "A facility that is configured with equipment suitable for supporting IT operations and has the computing equipment installed but not"], "a": 0, "r": "A cold site is a facility that is configured with equipment suitable", "src": "additional"}],
      accurate12: [{"id": 1, "d": 0, "q": "Triffid Corporation requires employees working with sensitive hardcopy documents to place them in a safe at the end of each workday. What type of control is the process of putting the documents into the safe?", "o": ["Administrative", "Tangential", "Physical", "Technical"], "a": 0, "r": "The process or rule requiring documents to be placed in the safe is an administrative control. - Administrative controls are policies, rules, and procedures. - The safe itself is a physical control, but the process of using it is administrative. - Tangential is not a recognised control category. - Technical controls relate to IT systems.", "src": "accurate"}, {"id": 2, "d": 0, "q": "A vendor publishes different sets of instructions for installing an operating system depending on the platform used. This is an example of a:", "o": ["Law", "Procedure", "Standard", "Policy"], "a": 1, "r": "A procedure provides step by step instructions for completing a specific task. - Law is government issued. - Standards are generally accepted across an industry. - Policies are high level organisational directives.", "src": "accurate"}, {"id": 3, "d": 0, "q": "Triffid Corporation publishes a policy requiring employees to act in a way that protects health and safety. The security office writes detailed instructions on how to wear protective gear in hazardous areas. What are these detailed instructions?", "o": ["Policy", "Procedure", "Standard", "Law"], "a": 1, "r": "A procedure describes the exact steps to perform a task inside an organisation. - Policy is the high level directive. - Standards apply broadly across an industry. - Law is issued by government.", "src": "accurate"}, {"id": 4, "d": 0, "q": "A widely recognised set of industry security rules called the Data Security Standard is followed by organisations worldwide. This is an example of a:", "o": ["Law", "Policy", "Standard", "Procedure"], "a": 2, "r": "A standard is a set of rules or best practices recognised across an industry. - Not a law because it is not issued by government. - Not a policy because it is not internal to one organisation. - Not a procedure because it does not describe specific steps for one task.", "src": "accurate"}, {"id": 5, "d": 0, "q": "Olaf, an ISC2 member and security analyst, knows his company is not following a security standard during an audit. What should Olaf do?", "o": ["Tell the auditors the truth", "Ask supervisors for guidance", "Ask ISC2 for guidance", "Lie to the auditors"], "a": 0, "r": "The ISC2 Code of Ethics requires members to: - Act honestly - Protect the profession - Act responsibly Therefore Olaf must report the truth.", "src": "accurate"}, {"id": 6, "d": 0, "q": "Siobhan, an ISC2 member, receives a parking ticket after work. What should she do?", "o": ["Inform ISC2", "Pay the ticket", "Inform supervisors", "Resign"], "a": 1, "r": "A parking ticket is a minor legal issue and unrelated to professional conduct. It does not need to be reported to ISC2 or the employer.", "src": "accurate"}, {"id": 7, "d": 0, "q": "In risk management, what is something that poses risk to an organisation or asset?", "o": ["Fear", "Threat", "Control", "Asset"], "a": 1, "r": "A threat is any potential cause of harm to an asset. - Control mitigates risk - Asset is something of value - Fear is not a formal risk management term", "src": "accurate"}, {"id": 8, "d": 0, "q": "A system records transactions to show which users performed certain actions. This provides:", "o": ["Non-repudiation", "Multifactor authentication", "Biometrics", "Privacy"], "a": 0, "r": "Non-repudiation ensures a user cannot deny performing an action. Logging transactions supports this.", "src": "accurate"}, {"id": 9, "d": 0, "q": "A software firewall blocks certain network traffic on a device. What type of control is this?", "o": ["Physical", "Administrative", "Passive", "Technical"], "a": 3, "r": "Technical controls are implemented using IT systems and technology. Firewalls operate within the IT environment.", "src": "accurate"}, {"id": 10, "d": 0, "q": "Triffid leadership publishes a document stating the company will follow SANS best practices. The Triffid document is a ______ and the SANS documents are ______.", "o": ["Law, policy", "Policy, standard", "Policy, law", "Procedure, procedure"], "a": 1, "r": "- The internal document created by management is a policy. - SANS best practices are industry standards.", "src": "accurate"}, {"id": 11, "d": 0, "q": "Phrenal sells a laptop online and hopes to get $100 but is willing to accept less. This demonstrates:", "o": ["Risk tolerance", "Risk inversion", "Threat", "Vulnerability"], "a": 0, "r": "Risk tolerance is the level of risk someone is willing to accept.", "src": "accurate"}, {"id": 12, "d": 0, "q": "A router is configured to allow only specific MAC addresses to join the network. This is an example of a:", "o": ["Physical control", "Administrative control", "Substantial control", "Technical control"], "a": 3, "r": "If the control is implemented through technology or IT systems, it is a technical control. A helpful rule of thumb often used in exams: > If it uses electricity or is part of an IT system, it is likely a technical control.", "src": "accurate"}],
      thor21: [{"id": 1, "d": 0, "q": "If we wanted to implement the CHEAPEST and the WEAKEST type of authentication, what would we implement?", "o": ["Biometric authentication", "Token-based authentication", "Password-based authentication", "One-time password"], "a": 2, "r": "Password-based authentication: Password-based authentication is generally the cheapest and weakest form of authentication, especially when compared to the other options listed. Password-based systems are relatively easy and cheap to implement since they require minimal infrastructure. For instance, an email or website login system would primarily require only a username and password field in a database, and some code to compare input values against the stored ones.", "src": "thor"}, {"id": 2, "d": 0, "q": "Our senior management wants to collect more Personal Identifiable Information (PII) from our customers in order to be able to sell more products to them. Which of these should be the MOST important when we decide how much PII (Personally Identifiable Information) we collect?", "o": ["The potential value of the data to malicious actors", "The laws and regulations that apply to the data", "The amount of data we need for our project", "The convenience for the user"], "a": 1, "r": "The laws and regulations that apply to the data: The collection, use, and storage of Personal Identifiable Information (PII) is highly regulated. Different jurisdictions may have differing rules for what constitutes PII and how it can be collected, stored, used, and shared. Notably, regulations like the General Data Protection Regulation (GDPR) in the European Union and the California Consumer Privacy Act (CCPA) in the United States provide strict guidelines about consent, transparency, data minimization, and purpose limitation. Companies must ensure compliance with these laws to avoid heavy fines and potential damage to their reputation. Therefore, when deciding how much PII to collect, the", "src": "thor"}, {"id": 3, "d": 0, "q": "What are the key differences between a botnet and a worm?", "o": ["A botnet is a type of malware that is used to launch distributed denial of service (DDoS) attacks, while a worm is a type of malware that is used to steal sensitive data.", "A botnet is a type of malware that infects a single computer, while a worm is a type of malware that infects multiple computers.", "A botnet is a type of malware that is used to launch spam campaigns, while a worm is a type of malware that is used to encrypt files and hold them for ransom.", "A botnet is a network of infected computers that are controlled by a single attacker, while a worm is a self-replicating piece of malware that spreads through networks."], "a": 3, "r": "A botnet is a network of infected computers that are controlled by a single attacker, while a worm is a self-replicating piece of malware that spreads through networks: A botnet is essentially a network of private computers infected with malicious software and controlled as a group without the owners' knowledge. The term comes from the words \"robot\" and \"network\". An attacker, also known as a 'bot-herder', typically uses the botnet for illicit purposes such as sending spam or carrying out Distributed Denial of Service (DDoS) attacks. A worm, on the other hand, is a type of malware that replicates itself in order to spread to other computers. It typically uses a network to spread, relying on", "src": "thor"}, {"id": 4, "d": 0, "q": "When we are talking about the governance part of our organization, who are we referring to?", "o": ["The employees", "The shareholders", "The CEO and other executives", "The board of directors"], "a": 3, "r": "The board of directors: When discussing the governance of an organization, we're primarily referring to the board of directors. The board of directors is a group of individuals who are elected by shareholders to oversee the management of an organization. They make strategic decisions, oversee the company's performance, and ensure the company is acting in the best interests of its shareholders. Their responsibilities include hiring and firing the CEO, approving budgets, setting company-wide policies, and making high-level decisions about the direction of the organization.", "src": "thor"}, {"id": 5, "d": 0, "q": "Which of the following is the MOST important factor in aligning a security function to a business strategy?", "o": ["Ensuring compliance with industry regulationswrong", "Developing strong communication with business stakeholders", "Conducting regular security assessments", "Implementing technical controls"], "a": 1, "r": "Developing strong communication with business stakeholders: While technical controls, compliance, and security assessments are all crucial aspects of a robust security strategy, aligning the security function to a business strategy primarily requires strong communication with business stakeholders.", "src": "thor"}, {"id": 6, "d": 0, "q": "To ensure the confidentiality, integrity, and availability of our backup tapes, where would it be appropriate to store them?", "o": ["In a secure, climate-controlled storage room within our office building", "In a secure, climate-controlled storage room in a commercial storage place", "In a secure, climate-controlled storage room at a tape storage vendor", "In a fire-proof safe in the office manager's office"], "a": 2, "r": "In a secure, climate-controlled storage room at a tape storage vendor: Storing backup tapes at a secure, climate-controlled storage room at a tape storage vendor ensures the highest level of protection for the tapes.", "src": "thor"}, {"id": 7, "d": 0, "q": "What is the main goal of implementing a defense-in-depth strategy in information security?", "o": ["To reduce the cost of security measures", "To prevent all external attacks", "To provide multiple layers of security controls", "To eliminate the need for security policies"], "a": 2, "r": "To provide multiple layers of security con mented security policieswrong"], "a": 2, "r": "External cyber attacks: According to a study by the Verizon Data Breach Investigation Report, the MOST common cause of data breaches in organizations is external cyber attacks.", "src": "thor"}, {"id": 13, "d": 0, "q": "Which type of control would best describe a security guard?", "o": ["Technical control", "Physical control", "Operational control", "Environmental control"], "a": 1, "r": "Physical control: Physical controls are security measures that are designed to deny unauthorized access to physical resources.", "src": "thor"}, {"id": 14, "d": 0, "q": "What is the MOST secure way to store sensitive data?", "o": ["Encrypting the data and storing it on a single physical serverwrong", "Storing the data in plain text on a cloud-based server", "Storing the data in plain text on a physical server", "Encrypting the data and storing it on a cloud-based server"], "a": 3, "r": "Encrypting the data and storing it on a cloud-based server.", "src": "thor"}, {"id": 15, "d": 0, "q": "What is a commonly used method for assessing the potential consequences of a disruption to an organization's operations and resources?", "o": ["Risk management", "Risk assessment", "Business impact analysis", "Threat analysis"], "a": 2, "r": "Business impact analysis (BIA).", "src": "thor"}, {"id": 16, "d": 0, "q": "What is the primary benefit of implementing a security awareness program in an organization?", "o": ["To increase employee productivity", "To ensure compliance with industry regulations", "To improve the overall security posture of the organization", "To prevent employees from accidentally leaking sensitive information"], "a": 2, "r": "To improve the overall security posture of the organization.", "src": "thor"}, {"id": 17, "d": 0, "q": "What can we implement that could help DECREASE identity theft online?", "o": ["Encourage people to use the same password for multiple accounts", "Store sensitive information in plain text", "Implement a single sign-on system", "Implement two-factor authentication"], "a": 3, "r": "Implement two-factor authentication.", "src": "thor"}, {"id": 18, "d": 0, "q": "Which of the following would be the MOST effective way to ensure the security of sensitive data in a cloud environment?", "o": ["Implementing firewalls and intrusion detection systems", "Conducting regular penetration testing", "Establishing regular backups and data recovery processes", "Implementing a zero-trust security model"], "a": 3, "r": "Implementing a zero-trust security model.", "src": "thor"}, {"id": 19, "d": 0, "q": "Which of the following is the MOST important principle of layered security?", "o": ["Implementing the most expensive security solutions at each layer", "Ensuring that all layers are equally secure", "Regularly testing and updating each layer", "Implementing security measures in a hierarchical mannerwrong"], "a": 2, "r": "Regularly testing and updating each layer.", "src": "thor"}, {"id": 20, "d": 0, "q": "What is the ULTIMATE goal of a risk assessment?", "o": ["To create a comprehensive report for management and stakeholders", "To implement measures to prevent all potential cyber attacks", "To identify all possible vulnerabilities and threats in an organization's systems and networks", "To prioritize and allocate resources to address the most significant risks"], "a": 3, "r": "To prioritize and allocate resources to address the most significant risks.", "src": "thor"}, {"id": 21, "d": 0, "q": "How does a buffer overflow vulnerability occur?", "o": ["By sending a large amount of data to a server, overloading its memory and causing it to crash", "By exploiting a weakness in the encryption algorithm used by a website", "By using a malicious code to gain access to unauthorized information", "By writing more data to a buffer than it can hold, causing the excess data to overflow into adjacent memory locations."], "a": 0, "r": "By writing more data to a buffer than it is allocated to hold, causing the excess data to overflow into adjacent memory areas.", "src": "thor"}],

    const DATASET_META = [{"key": "core115", "label": "Core CAT 115", "count": 115, "kind": "curated domains", "source": "Built into the simulator"}, {"key": "additional69", "label": "Additional Q and A 69", "count": 69, "kind": "markdown import", "source": "70+ Additional dumps.md"}, {"key": "accurate12", "label": "Accurate Wording 12", "count": 12, "kind": "markdown import", "source": "Probably_accurate_wording.md"}, {"key": "thor21", "label": "Thor Reference 21", "count": 21, "kind": "markdown import", "source": "Thor_Sample_cyber_security_exam_questions.md"}, {"key": "ucert115", "label": "UCertify Sample 115", "count": 115, "kind": "pdf import", "source": "SAMPLEisc2.ucertify...pdf"}, {"key": "cap20", "label": "CAP Demo 20", "count": 20, "kind": "pdf import", "source": "CAP-demo.pdf"}, {"key": "ccpdf_ref", "label": "CC Answer PDF Reference", "count": 0, "kind": "reference only", "source": "ISC2 CC Dump with answer.pdf"}];

    function getDatasetQuestions(key) {
      if (key === 'core115') return CORE_QUESTIONS.map(q => ({ ...q }));

    function shuffle(arr) {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function formatTime(s) {
      const h = Math.floor(s / 3600);
      const m = String(Math.floor((s % 3600) / 60)).padStart(2, '0');
      const sec = String(s % 60).padStart(2, '0');
      return `${h}:${m}:${sec}`;
    }

    function normaliseAnswer(a) {
      if (Array.isArray(a)) return [...a].sort((x, y) => x - y);
      return [a];
    }

    function selectedMatches(answer, selected) {
      const want = normaliseAnswer(answer);
      const got = [...selected].sort((x, y) => x - y);
      if (want.length !== got.length) return false;
      return want.every((v, i) => v === got[i]);
    }

    function hasMultipleAnswers(q) {
      return Array.isArray(q.a) && q.a.length > 1;
    }

    function getActivePool() {
      let pool = getDatasetQuestions(state.datasetKey);
      if (state.datasetKey === 'core115' && state.domainFilter !== 0) {
        pool = pool.filter(q => q.d === state.domainFilter);
      }
      return pool;
    }

    function getAvailableSizes(count) {
      const base = [10, 20, 25, 50, 75, 100, count];
      return [...new Set(base.filter(n => n > 0 && n <= count))].sort((a, b) => a - b);
    }

    function startExam() {
      const pool = getActivePool();
      if (!pool.length) return;
      state.questions = shuffle(pool).slice(0, Math.min(state.examSize, pool.length));
      state.qIdx = 0;
      state.selected = [];
      state.confirmed = false;
      state.answers = [];
      state.timer = 7200;
      state.phase = 'exam';
      stopTimer();
      state.interval = setInterval(() => {
        state.timer -= 1;
        if (state.timer <= 0) {
          state.timer = 0;
          stopTimer();
          state.phase = 'results';
        }
        render();
      }, 1000);
      render();
    }

    function stopTimer() {
      if (state.interval) {
        clearInterval(state.interval);
        state.interval = null;
      }

    function toggleSelection(idx) {
      const q = state.questions[state.qIdx];
      if (state.confirmed) return;
      if (hasMultipleAnswers(q)) {
        if (state.selected.includes(idx)) {
          state.selected = state.selected.filter(v => v !== idx);
        } else {
          state.selected = [...state.selected, idx];
        }
      } else {
        state.selected = [idx];
      }
      render();
    }

    function confirmAnswer() {
      const q = state.questions[state.qIdx];
      if (!state.selected.length) return;
      const correct = selectedMatches(q.a, state.selected);
      state.answers.push({
        qId: q.id,
        domain: q.d || 0,
        selected: [...state.selected],
        correct,
        correctAnswer: normaliseAnswer(q.a),
        source: q.src || state.datasetKey

      state.confirmed = true;
      render();

      return { correct, total, pct };

        stats[d] = {
          total: domAnswers.length,
          correct,
          pct: domAnswers.length ? Math.round((correct / domAnswers.length) * 100) : 0
        };
      });
      return stats;
    }

      for (const [k, v] of Object.entries(attrs)) {

        else if (k.startsWith('on') && typeof v === 'function') node.addEventListener(k.slice(2).toLowerCase(), v);

        else if (v !== null && v !== undefined) node.setAttribute(k, v);

      (Array.isArray(children) ? children : [children]).forEach(child => {
        if (child === null || child === undefined) return;
        if (typeof child === 'string') node.appendChild(document.createTextNode(child));
        else node.appendChild(child);
      });
      return node;

    }

    function render() {
      const app = document.getElementById('app');
      app.innerHTML = '';
      if (state.phase === 'menu') renderMenu(app);
      else if (state.phase === 'exam') renderExam(app);
      else renderResults(app);
    }

    render();
  </script>
</body>
</html>
