<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Local GLB Viewer</title>
<script type="module">
const statusEl = document.getElementById('status')
const sources = [
  'https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js',
  'https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js'
]
let loaded = false
for (const src of sources) {
  try {
    await import(src)
    loaded = true
    break
  }
  catch (err) {
    console.warn('model-viewer failed from', src, err)
  }
}
if (loaded) {
  statusEl.textContent = 'Loaded: cyber_tiny_planet_lively_full.glb'
}
else {
  statusEl.textContent = 'Could not load model-viewer from the internet. Check browser internet access, then refresh.'
}
</script>
<style>
html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  background: #070b18;
  overflow: hidden;
}
model-viewer {
  width: 100vw;
  height: 100vh;
}
.panel {
  position: fixed;
  left: 14px;
  bottom: 14px;
  max-width: 620px;
  color: #d7f7ff;
  background: rgba(0, 0, 0, 0.56);
  border: 1px solid rgba(120, 235, 255, 0.35);
  border-radius: 12px;
  padding: 10px 12px;
  font-family: system-ui, Segoe UI, Arial, sans-serif;
  font-size: 13px;
  line-height: 1.4;
}
.name {
  font-weight: 700;
}
</style>
</head>
<body>
<model-viewer
  src="cyber_tiny_planet_lively_full.glb"
  camera-controls
  auto-rotate
  shadow-intensity="1"
  exposure="1.15"
  environment-image="neutral"
  alt="Local GLB asset">
</model-viewer>
<div class="panel">
  <div class="name">Local GLB Viewer</div>
  <div id="status">Loading model-viewer...</div>
  <div>Drag to orbit. Scroll to zoom. Right click drag to pan.</div>
  <div>Leave this command window open while viewing. Press Enter here to stop the server.</div>
</div>
</body>
</html>
